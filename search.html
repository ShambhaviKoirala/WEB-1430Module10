<!DOCTYPE html>
<html lang="en">
<head>                                                           
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flix | Search</title>                                                           
  <link rel="stylesheet" href="https://unpkg.com/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="search">                                                           
  <header>
    <div class="container nav">                                                           
      <a href="index.html" class="logo">Flix</a>
      <nav>
        <a href="index.html" data-link="home">Movies</a>
        <a href="shows.html" data-link="shows">TV Shows</a>                                                           
        <a href="search.html" data-link="search">Search</a>
        <a href="favorites.html" data-link="favorites">Favorites</a>
      </nav>                                                           
    </div>
  </header>

  <main class="container">                                                           
    <h2>Search</h2>
    <form id="search-form" class="search-form">
      <label><input type="radio" name="type" value="movie" checked /> Movies</label>
      <label><input type="radio" name="type" value="tv" /> TV Shows</label>                                                           
      <input type="text" name="term" id="term" placeholder="Enter a title..." />
      <button type="submit" class="btn">Search</button>
    </form>                                                           

    <div class="grid" id="grid"></div>
    <div class="pagination" id="pagination"></div>                                                           
  </main>

  <div class="spinner" id="spinner"></div>                                                           

  <script src="https://unpkg.com/swiper@11/swiper-bundle.min.js"></script>
  <script src="js/script.js"></script>                                                           
</body>
</html>
